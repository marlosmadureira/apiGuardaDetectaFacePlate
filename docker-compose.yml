# Guarda - Piloto local (teste com câmera e API)
# Banco: PostgreSQL com extensão pgvector (busca vetorial de embeddings faciais).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guarda-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: guarda
      POSTGRES_PASSWORD: guarda
      POSTGRES_DB: guarda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guarda -d guarda"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: guarda-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://guarda:guarda@postgres:5432/guarda
      - CAMERA_INDEX=0
      - FACE_TOLERANCE=0.5
      # API_KEYS=chave1,chave2  (vazio = aberto em dev)
      # CORS_ORIGINS=http://localhost:3000,https://meu-site.com
      # Encaminhar placa para servidor externo (opcional):
      # PLATE_FORWARD_URL=https://seu-servidor.com/placas
      # PLATE_FORWARD_ENABLED=true
    volumes:
      - guarda_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    # Câmeras locais USB/V4L2 (comente as que não existirem no host)
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  guarda_data:
